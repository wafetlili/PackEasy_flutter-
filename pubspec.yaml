name: packeasy
description: "PackEasy : application de voyage (Firebase, notifications, multilingue)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.5+1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3
  http: ^1.2.2
  google_mobile_ads: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true